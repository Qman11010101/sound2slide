name: Windows CI and release

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci:
    name: Windows CI
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed." }
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests reuse the develop/main cache without spending cache quota on their own.
          save-if: ${{ github.event_name == 'push' }}
      - name: Install cargo-about
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          # Keep in sync with the version pinned in scripts/generate-licenses.ps1.
          tool: cargo-about@0.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run release tests
        run: ./scripts/test.ps1 -Release
      - name: Build DLL and license notices
        run: ./scripts/build.ps1
      - name: Package release
        run: ./scripts/package-release.ps1
      - name: Upload ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sound2slide-windows-x64
          path: dist/sound2slide-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: sound2slide-release
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sound2slide-windows-x64
          path: dist
      - name: Publish date-based release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: ./scripts/publish-release.ps1
