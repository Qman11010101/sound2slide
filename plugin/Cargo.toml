[package]
name = "sound2slide"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
publish = false
description = "Margrete plugin: sound2slide"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
marmkmt = { path = "../crates/marmkmt" }
raw-window-handle = "0.6.2"
rfd = "0.15"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
# ureq 3.4.2 checks the `native-tls` feature at runtime; `native-tls-no-default` alone panics on HTTPS.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
symphonia = { version = "0.5.4", features = ["mp3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
