name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: python -m pip install clang-format==22.1.3

      - name: Check formatting
        run: >-
          clang-format
          --dry-run
          --Werror
          include/*.h
          src/*.cpp
          tests/*.c
          tests/*.cpp

  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
